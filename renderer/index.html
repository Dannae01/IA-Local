<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    >

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/response.css">
    <link rel="stylesheet" href="vendor/highlight.css">
</head>

<body>

    <div id="nova-app">

        <!-- Burbuja cerrada -->
        <button class="bubble" id="bubble">
            <span></span>
        </button>


        <!-- Ventana de chat -->
        <div class="chat-window" id="chat-window">

            <div class="chat-header">

                <div class="nova-title">

                    <button
                        class="conversation-button"
                        id="conversation-button"
                        aria-label="Conversaciones"
                    >
                        ☰
                    </button>

                    <span class="nova-icon"></span>

                    <span>NOVA</span>

                </div>

                <div class="header-actions">

                    <button
                        class="new-chat-button"
                        id="new-chat-button"
                        aria-label="Nueva conversación"
                    >
                    </button>

                    <button
                        class="settings-button"
                        id="settings-button"
                        aria-label="Configuración"
                    >
                        <span>⚙︎</span>
                    </button>

                    <button
                        class="close-button"
                        id="close-button"
                    >
                        ×
                    </button>

                </div>

            </div>

            <div class="conversation-panel" id="conversation-panel">

                <div class="conversation-panel-header">

                    <span>Conversaciones</span>

                </div>

                <button
                    class="conversation-new-button"
                    id="conversation-new-button"
                >
                    + Nueva conversación
                </button>

                <div
                    class="conversation-list"
                    id="conversation-list"
                >
                </div>

                <div
                    class="delete-dialog"
                    id="delete-dialog"
                >
                    <div class="delete-dialog-box">

                        <div class="delete-dialog-title">
                            ¿Eliminar esta conversación?
                        </div>

                        <div class="delete-dialog-text">
                            Esta acción no se puede deshacer.
                        </div>

                        <div class="delete-dialog-actions">

                            <button id="delete-cancel-button">
                                Cancelar
                            </button>

                            <button id="delete-confirm-button">
                                Eliminar
                            </button>

                        </div>

                    </div>
                </div>

                <div
                    class="rename-dialog"
                    id="rename-dialog"
                >
                    

                    <div class="rename-dialog-box">

                        <div class="rename-dialog-title">
                            Renombrar conversación
                        </div>

                        <input
                            type="text"
                            id="rename-input"
                            placeholder="Nombre de la conversación"
                            autocomplete="off"
                        >

                        <div class="rename-dialog-actions">

                            <button
                                id="rename-cancel-button"
                            >
                                Cancelar
                            </button>

                            <button
                                id="rename-confirm-button"
                            >
                                Guardar
                            </button>

                        </div>

                    </div>

                </div>

            </div>            

            <div
                class="conversation-documents"
                id="conversation-documents"
            >
            </div>

            <div class="chat-messages" id="chat-messages">

                <div class="message nova-message">
                    Hola 👋<br>
                    Soy NOVA. ¿En qué puedo ayudarte?
                </div>

            </div>


            <div class="chat-input-area">

                <button
                    id="import-document-button"
                    aria-label="Importar documento"
                    title="Importar documento"
                >
                    📎
                </button>

                <input
                    type="text"
                    id="chat-input"
                    placeholder="Escribe un mensaje..."
                    autocomplete="off"
                >

                <button id="send-button">
                    ↑
                </button>

            </div>

        </div>

    </div>

    <div id="settings-panel" class="settings-panel hidden">

        <div class="settings-header">
            <h2>Configuración</h2>

            <button id="close-settings">×</button>
        </div>

        <div class="settings-section">

            <label for="model-select">
                Modelo de IA
            </label>

            <select id="model-select">
                <option value="">Cargando modelos...</option>
            </select>

        </div>

        <div class="settings-section">

            <label for="temperature">
                Temperatura
            </label>

            <div class="range-container">

                <input
                    type="range"
                    id="temperature"
                    min="0"
                    max="1.5"
                    step="0.1"
                    value="0.7"
                >

                <span id="temperature-value">
                    0.7
                </span>

            </div>

            <small>
                Controla qué tan variadas serán las respuestas.
            </small>

        </div>

        <div class="settings-section">

            <label for="context-size">
                Tamaño de contexto
            </label>

            <select id="context-size">

                <option value="4096">
                    4096 tokens
                </option>

                <option value="8192" selected>
                    8192 tokens
                </option>

                <option value="16384">
                    16384 tokens
                </option>

                <option value="32768">
                    32768 tokens
                </option>

            </select>

            <small>
                Determina cuánta información puede utilizar NOVA durante una conversación.
            </small>

        </div>

    </div>

    <script src="vendor/marked.umd.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="js/responseRenderer.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
